<script>
/* NutriSport 1.1: sincronización y puente preparado para Android nativo */
(function(){
  const VERSION='1.3.0';
  window.NUTRISPORT_VERSION=VERSION;
  window.NutriSportNative=Object.assign(window.NutriSportNative||{}, {
    version:VERSION,
    isNative:()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()),
    emit:(name,data={})=>{try{window.dispatchEvent(new CustomEvent('nutrisport:native',{detail:{name,data}}));}catch(e){}}
  });
  function current(){try{return window.firebaseAuth?.currentUser||null}catch(e){return null}}
  function syncState(){
    const u=current(); if(!u)return;
    const premium=!!(window.nsIsPremium&&window.nsIsPremium(u));
    document.documentElement.dataset.nsPremium=premium?'1':'0';
    document.documentElement.dataset.nsVersion=VERSION;
    window.NutriSportNative.emit('auth-state',{uid:u.uid,email:u.email||'',premium});
  }
  function net(){
    let el=document.getElementById('ns-net-status');
    if(!el){el=document.createElement('div');el.id='ns-net-status';el.style.cssText='position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:8px 12px;border-radius:999px;font:800 11px system-ui;background:#171717;color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.3)';document.body.appendChild(el)}
    if(!navigator.onLine){el.textContent='Sin conexión • los cambios locales se conservarán';el.style.display='block';el.style.background='#3b1f08';}
    else {el.textContent='Conexión restaurada • sincronizando';el.style.display='block';el.style.background='#12351d';setTimeout(()=>el.style.display='none',1800);}
  }
  window.addEventListener('offline',net);window.addEventListener('online',()=>{net();syncState();window.NutriSportNative.emit('online');});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{syncState();});else syncState();
  setInterval(syncState,2000);
})();
</script>
