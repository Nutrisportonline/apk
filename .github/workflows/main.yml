name: NutriSport Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK NutriSport
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar configuración Firebase Android
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: Falta google-services.json"
            exit 1
          fi

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar configuración de Capacitor
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.nutrisport.app",
            "appName": "NutriSport",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          JSON

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Configurar Firebase Authentication nativo
        run: |
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          # variables.gradle
          p = Path("android/variables.gradle")
          s = p.read_text()

          if "rgcfaIncludeGoogle" not in s:
              s = s.replace(
                  "ext {",
                  """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'""",
                  1
              )

          p.write_text(s)

          # android/build.gradle
          root = Path("android/build.gradle")
          s = root.read_text()

          if "com.google.gms:google-services" not in s:
              if "buildscript {" not in s:
                  s = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.5.0'
              }
          }

          """ + s
              else:
                  marker = "dependencies {"
                  pos = s.find(marker)

                  if pos >= 0:
                      insert = pos + len(marker)
                      s = (
                          s[:insert]
                          + "\n        classpath 'com.google.gms:google-services:4.5.0'"
                          + s[insert:]
                      )

          root.write_text(s)

          # android/app/build.gradle
          app = Path("android/app/build.gradle")
          s = app.read_text()

          if "com.google.gms.google-services" not in s:
              s = "apply plugin: 'com.google.gms.google-services'\n" + s

          app.write_text(s)
          PY

      - name: Configurar icono Android
        run: |
          cp -R android-icon/mipmap-* android/app/src/main/res/

          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cp \
            android-icon/ic_launcher_foreground.png \
            android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          cp \
            android-icon/values/ic_launcher_background.xml \
            android/app/src/main/res/values/ic_launcher_background.xml

          cp \
            android-icon/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp \
            android-icon/mipmap-anydpi-v26/ic_launcher_round.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Configurar firma debug estable
        run: |
          mkdir -p android-signing

          base64 -d \
            android-signing/nutrisport-debug.jks.b64 \
            > android-signing/nutrisport-debug.jks

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "nutrisportDebug" not in s:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  nutrisportDebug {
                      storeFile file('../../android-signing/nutrisport-debug.jks')
                      storePassword 'nutrisport'
                      keyAlias 'nutrisportdebug'
                      keyPassword 'nutrisport'
                  }
              }""",
                  1
              )

              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
              debug {
                  signingConfig signingConfigs.nutrisportDebug
              }""",
                  1
              )

          p.write_text(s)
          PY

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: No se genero el APK"
            exit 1
          fi

          echo "APK generado correctamente"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriSport-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
